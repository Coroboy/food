<div class="group relative w-full h-full p-[2px] rounded-[2.5rem] bg-gradient-to-br from-indigo-500/20 to-violet-500/20 transition-all duration-500 hover:from-indigo-500/40 hover:to-violet-500/40 hover:shadow-[0_0_40px_rgba(99,102,241,0.15)] active:scale-[0.98]"
    [class.grayscale]="!food.is_available" [class.opacity-60]="!food.is_available">

    <!-- Contenedor Vidrio -->
    <div class="relative bg-white border border-slate-200 rounded-[2.4rem] overflow-hidden h-full flex flex-col p-4 shadow-sm">

        <!-- Imagen Hero -->
        <div class="relative h-64 w-full rounded-3xl overflow-hidden shadow-2xl shrink-0">
            @if(food.img_url && food.img_url.trim().length > 0) {
            <img [src]="food.img_url" [alt]="food.name" (error)="handleImageError($event)"
                class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" />
            } @else {
            <img [src]="getFallbackImage()" [alt]="food.name"
                class="w-full h-full object-cover group-hover:scale-110 opacity-70" />
            }

            <!-- Badges sobre imagen -->
            <div class="absolute top-4 left-4 flex flex-col gap-2">
                <span
                    class="px-3 py-1 rounded-full bg-slate-950/60 backdrop-blur-md text-white text-[9px] font-black uppercase tracking-widest border border-white/10">
                    {{ food.category }}
                </span>
                @if(!food.is_available) {
                <span
                    class="px-3 py-1 rounded-full bg-rose-500 text-white text-[9px] font-black uppercase tracking-widest border border-rose-400/50 shadow-[0_0_15px_rgba(244,63,94,0.3)]">
                    Agotado
                </span>
                }
            </div>

            <!-- Precio Overlay -->
            <div
                class="absolute bottom-4 right-4 px-4 py-2 rounded-2xl bg-indigo-600/90 backdrop-blur-md border border-white/20 shadow-xl">
                <span class="text-white font-black text-lg tracking-tighter">{{ food.price | currency }}</span>
            </div>
        </div>

        <!-- Contenido -->
        <div class="pt-6 pb-2 px-1 flex flex-col flex-grow">
            <h3 class="text-2xl font-black text-slate-900 tracking-tight leading-tight line-clamp-2 mb-3">
                {{ food.name }}
            </h3>

            <p class="text-slate-600 text-xs font-medium leading-relaxed mb-8 line-clamp-3 italic opacity-80">
                "{{ food.description }}"
            </p>

            <!-- Accion -->
            <div class="mt-auto">
                <button [disabled]="!food.is_available" (click)="addToCart()"
                    class="w-full group/btn py-4 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-100 transition-all flex items-center justify-center gap-2 disabled:opacity-20">
                    <span
                        class="text-slate-900 text-[10px] font-black uppercase tracking-[0.3em] group-hover/btn:text-indigo-600">Añadir al Carrito</span>
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-3.5 w-3.5 text-slate-400 transition-transform group-hover/btn:translate-x-1 group-hover/btn:text-indigo-600"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
