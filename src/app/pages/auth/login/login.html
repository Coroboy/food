<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-indigo-50/50 to-violet-50/50">
  <!-- Hero Background Orbs (same as Home) -->
  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-indigo-600/5 blur-[120px] rounded-full -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-violet-600/5 blur-[100px] rounded-full translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>

  <div class="max-w-md w-full space-y-4 bg-white/80 p-8 rounded-3xl shadow-2xl border border-white/40 backdrop-blur-xl relative z-10">
    <div class="text-center">
      <div class="flex justify-center mb-4">
        <div class="relative w-16 h-16 flex items-center justify-center overflow-hidden rounded-full shadow-lg border-2 border-indigo-100">
            <img src="/logo.png" alt="KyberGourmet Logo" class="relative w-full h-full object-cover" />
        </div>
      </div>
      <h2 class="text-3xl font-black text-slate-900 tracking-tighter leading-tight">
        Bienvenido a <br/>
        <span class="text-indigo-600 font-black">Kyber-Gourmet</span>
      </h2>
    </div>
    
    <form class="mt-6 space-y-4" (ngSubmit)="onLogin()">
      <div class="space-y-3">
        <div>
          <label for="email-address" class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 px-1">Email (Opcional)</label>
          <input id="email-address" name="email" type="email" autocomplete="email"
            [(ngModel)]="email"
            class="block w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-300"
            placeholder="Introduce tu correo">
        </div>
        <div class="relative">
          <label for="password" class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 px-1">Password (Opcional)</label>
          <div class="relative">
            <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password"
              [ngModel]="password()" (ngModelChange)="password.set($event)"
              class="block w-full px-4 py-3 pr-12 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-300"
              placeholder="••••••••">
            <button type="button" (click)="showPassword.set(!showPassword())" 
              class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-indigo-600 transition-all bg-white/50 rounded-xl hover:bg-white hover:shadow-sm">
              <!-- Eye Icon (Show) -->
              <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4.5 w-4.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <!-- Eye Off Icon (Hide) -->
              <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4.5 w-4.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="pt-1">
        <button type="submit" [disabled]="isLoading()"
          class="group relative w-full flex justify-center py-3.5 px-4 bg-slate-900 hover:bg-indigo-600 text-white text-[11px] font-black uppercase tracking-widest rounded-xl shadow-xl shadow-slate-200 hover:shadow-indigo-500/30 transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed">
          <span class="flex items-center gap-2">
            <svg *ngIf="!isLoading()" class="h-5 w-5 opacity-50 group-hover:opacity-100 transition-opacity" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <svg *ngIf="isLoading()" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ isLoading() ? 'Iniciando sesión...' : 'Entrar ahora' }}
          </span>
        </button>
      </div>

      <div class="text-center space-y-4">
        <p class="text-[11px] font-black uppercase tracking-widest text-slate-400">
          ¿No tienes cuenta? 
          <a routerLink="/register" class="text-indigo-600 hover:text-violet-600 transition-colors">Regístrate</a>
        </p>
        <div class="text-[11px] font-black uppercase tracking-widest text-slate-400 pt-2 border-t border-slate-100">
          <a routerLink="/forgot-password" class="hover:text-indigo-600 transition-colors opacity-60 hover:opacity-100">¿Olvidaste tu contraseña?</a>
        </div>
      </div>
    </form>
  </div>
</div>
