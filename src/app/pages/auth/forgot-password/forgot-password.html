<div class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-indigo-50/50 to-violet-50/50">
  <!-- Hero Background Orbs (same as Home) -->
  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-indigo-600/5 blur-[120px] rounded-full -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-violet-600/5 blur-[100px] rounded-full translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>

  <div class="max-w-md w-full space-y-4 bg-white/80 p-8 rounded-3xl shadow-2xl border border-white/40 backdrop-blur-xl relative z-10">
    <div *ngIf="!isSent()">
      <div class="text-center">
        <div class="flex justify-center mb-4">
          <div class="relative w-16 h-16 flex items-center justify-center overflow-hidden rounded-full shadow-lg border-2 border-indigo-100">
              <img src="/logo.png" alt="KyberGourmet Logo" class="relative w-full h-full object-cover" />
          </div>
        </div>
        <h2 class="text-3xl font-black text-slate-900 tracking-tighter leading-tight">
          Recuperar acceso
        </h2>
      </div>
      
      <form class="mt-6 space-y-4" (ngSubmit)="onReset()">
        <div>
          <label for="email-address" class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1.5 px-1">Email</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required
            [(ngModel)]="email"
            class="block w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-300"
            placeholder="Tu correo">
        </div>

        <div class="space-y-3 pt-1">
          <button type="submit" [disabled]="isLoading()"
            class="group relative w-full flex justify-center py-3.5 px-4 bg-slate-900 hover:bg-indigo-600 text-white text-[11px] font-black uppercase tracking-widest rounded-xl shadow-xl shadow-slate-200 hover:shadow-indigo-500/30 transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed">
            <span class="flex items-center gap-2">
              <svg *ngIf="!isLoading()" class="h-5 w-5 opacity-50 group-hover:opacity-100 transition-opacity" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <svg *ngIf="isLoading()" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              {{ isLoading() ? 'Enviando...' : 'Enviar enlace' }}
            </span>
          </button>
          
          <div class="text-center">
            <a routerLink="/login" class="text-[11px] font-black uppercase tracking-widest text-slate-400 hover:text-indigo-600 transition-colors">
              Volver al inicio de sesión
            </a>
          </div>
        </div>
      </form>
    </div>

    <div *ngIf="isSent()" class="text-center space-y-8 py-8">
      <div class="flex justify-center">
        <div class="bg-indigo-100 p-4 rounded-full shadow-inner animate-bounce">
          <svg class="h-12 w-12 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
      </div>
      <div>
        <h2 class="text-3xl font-black text-slate-900 tracking-tighter">¡Correo enviado!</h2>
        <p class="mt-4 text-slate-600 font-medium">
          Revisa tu bandeja de entrada en <br/>
          <strong class="text-indigo-600">{{ email() }}</strong>
        </p>
      </div>
      <button routerLink="/login"
        class="w-full inline-flex justify-center py-4 px-4 bg-slate-900 hover:bg-indigo-600 text-white text-sm font-black uppercase tracking-widest rounded-2xl shadow-xl transition-all duration-300">
        Volver al inicio de sesión
      </button>
    </div>
  </div>
</div>
