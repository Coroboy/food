<div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] flex flex-col items-center gap-3 pointer-events-none w-full max-w-md px-4">
    @for (toast of notificationService.queue(); track toast.id) {
    <div class="pointer-events-auto flex items-center gap-4 bg-slate-900/95 backdrop-blur-xl border border-white/10 px-6 py-4 rounded-[1.5rem] shadow-2xl 
                animate-in fade-in slide-in-from-bottom-8 slide-in-from-left-0 duration-500 ease-out
                hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer group"
        (click)="notificationService.dismiss(toast.id)">
        
        <!-- Icon -->
        <div class="w-8 h-8 rounded-full flex items-center justify-center p-1.5 shrink-0"
             [ngClass]="{
                 'bg-emerald-500/20 text-emerald-400': toast.type === 'success',
                 'bg-rose-500/20 text-rose-400': toast.type === 'error',
                 'bg-indigo-500/20 text-indigo-400': toast.type === 'info'
             }">
            @if(toast.type === 'success') {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
            } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                </svg>
            }
        </div>

        <!-- Message -->
        <span class="text-white text-[10px] sm:text-[11px] font-black uppercase tracking-[0.2em] leading-tight">
            {{ toast.message }}
        </span>

        <!-- Dismiss -->
        <button class="ml-2 text-white/20 group-hover:text-white/60 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>
    }
</div>
